<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="100%" height="220">
  <defs>
    <!-- Gradiente de fundo escuro Pochteca -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081409"/>
      <stop offset="50%" stop-color="#102613"/>
      <stop offset="100%" stop-color="#071208"/>
    </linearGradient>

    <!-- Gradiente do texto com animação de brilho -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#e2f5d5"/>
      <stop offset="50%" stop-color="#9fe056"/>
      <stop offset="65%" stop-color="#e2f5d5"/>
      <stop offset="100%" stop-color="#ffffff"/>
      <animate attributeName="x1" from="-100%" to="100%" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="x2" from="0%" to="200%" dur="7s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Gradiente da linha laser animada -->
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#244d18" stop-opacity="0"/>
      <stop offset="40%" stop-color="#4a7c1f" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#9fe056" stop-opacity="1"/>
      <stop offset="60%" stop-color="#4a7c1f" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#244d18" stop-opacity="0"/>
      <animate attributeName="x1" from="-100%" to="100%" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="x2" from="0%" to="200%" dur="4s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Efeito de brilho/glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 0.85; }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      50% { transform: translateY(-8px) translateX(4px); opacity: 0.8; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
    }
    .grid-line { stroke: #1a3c1c; stroke-width: 0.8; opacity: 0.45; }
    .pulse-dot { animation: pulseGlow 2.5s ease-in-out infinite; }
  </style>

  <!-- Fundo com bordas suaves -->
  <rect width="900" height="220" rx="16" fill="url(#bgGrad)" stroke="#27561b" stroke-width="1.2"/>

  <!-- Grade cibernética sutil no fundo -->
  <g class="grid-line">
    <line x1="0" y1="55" x2="900" y2="55"/>
    <line x1="0" y1="110" x2="900" y2="110"/>
    <line x1="0" y1="165" x2="900" y2="165"/>
    <line x1="150" y1="0" x2="150" y2="220"/>
    <line x1="300" y1="0" x2="300" y2="220"/>
    <line x1="450" y1="0" x2="450" y2="220"/>
    <line x1="600" y1="0" x2="600" y2="220"/>
    <line x1="750" y1="0" x2="750" y2="220"/>
  </g>

  <!-- Pontos de conexão pulsantes com SMIL -->
  <circle cx="150" cy="55" r="3" fill="#7bb23a" class="pulse-dot">
    <animate attributeName="r" values="2;4.5;2" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="750" cy="165" r="3" fill="#7bb23a" class="pulse-dot">
    <animate attributeName="r" values="2;4.5;2" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;1;0.3" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="55" r="2.5" fill="#4a7c1f">
    <animate attributeName="opacity" values="0.2;0.9;0.2" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="300" cy="165" r="2.5" fill="#4a7c1f">
    <animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <!-- Status pill superior -->
  <g transform="translate(365, 28)">
    <rect width="170" height="24" rx="12" fill="#0d2110" stroke="#376d24" stroke-width="1"/>
    <circle cx="16" cy="12" r="4" fill="#9fe056">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="30" y="16.5" fill="#a8e36e" font-family="'Segoe UI', -apple-system, monospace" font-size="11" font-weight="700" letter-spacing="1.5">SYSTEM // ONLINE</text>
  </g>

  <!-- Nome Principal com Tipografia Forte e Gradiente Dinâmico -->
  <text x="450" y="105" text-anchor="middle" fill="url(#textGrad)" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="40" font-weight="900" letter-spacing="3" filter="url(#glow)">
    ESTÊVÃO BUENO
  </text>

  <!-- Linha laser neon com pulso dinâmico -->
  <rect x="180" y="125" width="540" height="2.5" rx="1.25" fill="url(#laserGrad)"/>

  <!-- Subtítulo Técnico -->
  <text x="450" y="156" text-anchor="middle" fill="#8bc94d" font-family="'Segoe UI', -apple-system, sans-serif" font-size="13.5" font-weight="600" letter-spacing="2.5">
    ENGENHARIA DA COMPUTAÇÃO  •  FULL-STACK  •  SUPORTE TI
  </text>

  <!-- Local / Empresa Tag -->
  <text x="450" y="182" text-anchor="middle" fill="#609139" font-family="'Segoe UI', monospace" font-size="11" font-weight="500" letter-spacing="1.8">
    POCHTECA COREMAL // TECH ECOSYSTEM
  </text>
</svg>
